<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ECECF4"/>
  <!-- phone -->
  <rect x="245" y="110" width="310" height="580" rx="44" fill="#FFFFFF" stroke="#2438B4" stroke-width="14"/>
  <rect x="275" y="165" width="250" height="450" rx="18" fill="#ECECF4"/>
  <line x1="360" y1="650" x2="440" y2="650" stroke="#2438B4" stroke-width="14" stroke-linecap="round"/>
  <!-- pulse line -->
  <polyline points="290,400 340,400 365,340 395,470 425,300 455,430 480,400 510,400" fill="none" stroke="#2438B4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="425" cy="300" r="14" fill="#D8434F"/>
  <!-- message bubbles on screen -->
  <rect x="300" y="200" width="130" height="50" rx="20" fill="#9FA1C6"/>
  <rect x="370" y="270" width="130" height="50" rx="20" fill="#6F74C4"/>
  <rect x="300" y="520" width="150" height="50" rx="20" fill="#9FA1C6"/>
  <!-- signal arcs -->
  <g fill="none" stroke="#6F74C4" stroke-width="12" stroke-linecap="round">
    <path d="M590 250 a90 90 0 0 1 0 140"/>
    <path d="M630 210 a150 150 0 0 1 0 220"/>
    <path d="M210 250 a90 90 0 0 0 0 140"/>
    <path d="M170 210 a150 150 0 0 0 0 220"/>
  </g>
</svg>
