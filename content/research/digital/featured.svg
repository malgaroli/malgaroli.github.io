  <polyline points="420,420 455,420 470,385 490,450 510,395 530,435 545,420 600,420" fill="none" stroke="#2438B4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="510" cy="395" r="10" fill="#D8434F"/>
  <!-- phone in the corner -->
  <rect x="600" y="560" width="120" height="200" rx="22" fill="#FFFFFF" stroke="#2438B4" stroke-width="12"/>
  <rect x="616" y="585" width="88" height="140" rx="8" fill="#ECECF4"/>
  <circle cx="660" cy="640" r="18" fill="#D8434F"/>
  <rect x="630" y="675" width="60" height="14" rx="7" fill="#6F74C4"/>
