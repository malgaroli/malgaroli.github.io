  <rect x="150" y="170" width="500" height="330" rx="26" fill="#FFFFFF" stroke="#2438B4" stroke-width="14"/>
  <rect x="180" y="200" width="440" height="270" rx="12" fill="#ECECF4"/>
  <path d="M90 520 h620 a20 20 0 0 1 20 20 v10 a30 30 0 0 1 -30 30 h-600 a30 30 0 0 1 -30 -30 v-10 a20 20 0 0 1 20 -20 z" fill="#9FA1C6" stroke="#2438B4" stroke-width="14" stroke-linejoin="round"/>
